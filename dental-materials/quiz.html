<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>口腔材料学 · 遮答练习</title>
<style>* { box-sizing: border-box }
:root { color-scheme: light }
[hidden] { display: none !important }
body { margin: 0; font: 16px/1.6 system-ui, 'Microsoft YaHei', sans-serif }
.desk { width: min(900px, calc(100% - 28px)); margin: auto; padding: 1rem 0 3rem }
.hero { position: relative; isolation: isolate; overflow: hidden; padding: .9rem 0 1rem }
h1 { margin: 0; font-size: clamp(1.9rem, 6vw, 2.8rem) }
h2 { margin: 0 0 .6rem; font-size: 1.45rem }
p { margin: .5rem 0 }
section { margin: 1rem 0 1.8rem }
.lede, .question, .controls, .result { padding: clamp(.75rem, 3vw, 1.25rem); border: 1px solid var(--desk-line, #dcd1da); border-radius: 12px; background: var(--desk-paper, #fffdfd) }
.fold { position: absolute; inset: 0 0 0 auto; width: 38%; z-index: -1; pointer-events: none }
.button, button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .35rem .8rem; font: inherit; cursor: pointer; border: 1px solid var(--desk-line, #dcd1da); border-radius: 8px; color: inherit; background: var(--desk-paper, #fffdfd); text-decoration: none }
.primary, .button:not(.secondary) { background: var(--desk-accent, #60475a); color: white }
button:disabled { cursor: default; opacity: .6 }
button[aria-pressed="true"] { font-weight: bold; outline: 2px solid var(--desk-accent, #60475a); outline-offset: -2px }
select, textarea, input { font: inherit }
select, textarea { min-height: 44px; width: 100%; min-width: 0; color: inherit; background: var(--desk-paper, #fffdfd); border: 1px solid var(--desk-line, #dcd1da); border-radius: 6px; padding: .35rem .55rem }
textarea { resize: vertical }
*:focus-visible { outline: 2px solid var(--desk-accent, #60475a); outline-offset: 2px }
.filters { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%, 145px),1fr)); gap: .6rem }
.tools { display: flex; flex-wrap: wrap; gap: .55rem; align-items: center; margin-top: .75rem }
.controls p, .meta { color: var(--desk-muted, #625561); font-size: .91rem }
.question { margin: .8rem 0; min-width: 0; overflow-wrap: anywhere; scroll-margin-top: 1rem }
.question h3 { margin: .45rem 0 .7rem; font-size: 1.06rem; line-height: 1.55 }
.option { display: flex; gap: .65rem; align-items: baseline; min-height: 44px; padding: .45rem .6rem; margin: .3rem 0; border: 1px solid var(--desk-line, #dcd1da); border-radius: 7px; cursor: pointer }
.option input { flex: none; margin: 0 }
.option.chosen { outline: 2px solid var(--desk-accent, #60475a); outline-offset: -2px }
.option.correct { border-color: #287248; background: #e9f5ed; color: #17442a }
.option.incorrect { border-color: #a75147; background: #fff0ee; color: #762d24 }
.feedback { border-top: 1px solid var(--desk-line, #dcd1da); margin-top: .65rem; padding-top: .45rem }
.result { margin-bottom: .85rem }
.metrics { margin: .35rem 0; font-weight: 600 }
table { width: 100%; border-collapse: collapse; table-layout: fixed }
th,td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--desk-line, #dcd1da); padding: .55rem .4rem; overflow-wrap: anywhere }
th[scope="row"] { font-weight: 600 }
td:last-child, th:last-child { width: 22% }
.chapters th:first-child { width: 36% }
.chapters td:last-child, .chapters th:last-child { width: 20%; text-align: right }
small { display: block; font-weight: 400; color: var(--desk-muted, #625561) }
@media (max-width: 520px) {
  .chapters td, .chapters th { font-size: .88rem }
  .study-desk-links { flex-wrap: wrap }
  ul { padding-inline-start: 1.25rem }
}
</style>
<style id="study-desk-theme">
@font-face {
  font-family: "Desk Song";
  src: local("STSong"), local("华文宋体");
  font-weight: 400;
  font-display: swap;
}

:root {
  color-scheme: light;
  --desk-bg: #f3f0f1;
  --desk-paper: #fffdfd;
  --desk-ink: #2d272e;
  --desk-muted: #625561;
  --desk-line: #dcd1da;
  --desk-fold: #ede4eb;
  --desk-accent: #60475a;
  --desk-hover: #75576e;
  --desk-glass: linear-gradient(151deg, #fffdfdf2, #eee6eddb);
  --desk-shadow: 0 2px 4px #392f3609, 0 8px 24px #392f3608;
  --desk-song: "Desk Song", "STSong", "华文宋体", "Songti SC", SimSun, serif;
  --desk-width: 820px;
  --desk-spring: cubic-bezier(.18, 1.24, .32, 1);
  --desk-spring-press: cubic-bezier(.2, 1.45, .47, 1);

  /* Existing pages use several names for the same roles. */
  --bg: var(--desk-bg);
  --card: var(--desk-paper);
  --card2: var(--desk-fold);
  --ink: var(--desk-ink);
  --tx: var(--desk-ink);
  --sub: var(--desk-muted);
  --dim: var(--desk-muted);
  --line: var(--desk-line);
  --hl: var(--desk-accent);
  --hl2: var(--desk-accent);
  --acc: var(--desk-accent);
  --accent: var(--desk-accent);
  --code: var(--desk-fold);
  --ok: #226040;
  --okbg: #e8f4eb;
  --bad: #922f34;
  --badbg: #faebec;
  --warn: #744c1b;
  --warnbg: #f7f0e3;
}

@view-transition{navigation:auto}
::view-transition-old(root){animation:desk-page-out .2s ease both}
::view-transition-new(root){animation:desk-page-in .36s cubic-bezier(.22,1,.36,1) both}
@keyframes desk-page-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes desk-page-in{from{opacity:0;transform:translateY(9px)}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

.pleats{position:absolute;z-index:-1;overflow:hidden;right:-1px;bottom:23px;width:clamp(160px,27vw,370px);height:100px;pointer-events:none;opacity:.86}
.pleats i{position:absolute;inset:0}
.pleats i:nth-child(1){clip-path:polygon(0 88%,42% 13%,33% 100%);background:linear-gradient(130deg,#c5b5c496,#efeaed)}
.pleats i:nth-child(2){clip-path:polygon(33% 100%,42% 13%,62% 29%);background:linear-gradient(130deg,#c0abba,#e9e0e7)}
.pleats i:nth-child(3){clip-path:polygon(33% 100%,62% 29%,62% 75%);background:linear-gradient(140deg,#eee5ec,#d4c4d0)}
.pleats i:nth-child(4){clip-path:polygon(62% 29%,83% 0,62% 75%);background:linear-gradient(125deg,#c7b2c2,#eee5ec)}
.pleats i:nth-child(5){clip-path:polygon(62% 75%,83% 0,100% 56%);background:linear-gradient(120deg,#d5c4d0,#f4eff4)}

body.study-page {
  background: radial-gradient(ellipse at 85% 0, #eee6ed, transparent 550px), var(--desk-bg);
  color: var(--desk-ink);
  font-family: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", sans-serif;
}

.study-page :is(h1, h2, .stem, .st, .ask, .card header h3, .ans .dx),
.study-page[data-desk-page="premed-quiz"] .q,
.study-page[data-desk-page="odontogenic"] .card > .q {
  font-family: var(--desk-song);
  font-weight: 400;
  text-wrap: pretty;
}

.study-page :is(h1, h2, h3, h4) { color: var(--desk-ink); }
.study-page a { color: var(--desk-accent); }
.study-page :is(.sub, .foot, .src, .hint, .cap, figcaption, .who) { color: var(--desk-muted); }
.study-page :is(a, button, summary, input, textarea):focus-visible {
  outline: 2px solid var(--desk-accent);
  outline-offset: 3px;
}

.study-page .study-desk-nav {
  position: relative;
  isolation: isolate;
  background: transparent;
  padding-inline: clamp(10px, 3vw, 22px);
  border-bottom: 0;
}

.study-page .study-desk-nav::after {
  content: "";
  position: absolute;
  inset: auto max(12px, calc((100% - var(--desk-width)) / 2)) 0;
  border-bottom: 1px solid var(--desk-line);
  pointer-events: none;
}

.study-page .study-desk-links { max-width: var(--desk-width); }
.study-page .study-desk-links > span {
  margin-inline-start: auto;
  color: var(--desk-muted);
  font-size: .83em;
}

.study-page :is(.study-desk-nav a, .btn, .bar button, .tools button, .chip, .acts button, .copy, .jump a, :where(#toTop)) {
  min-height: 34px;
  border: 1px solid var(--desk-line);
  border-radius: 100px;
  background: var(--desk-glass);
  color: var(--desk-accent);
  box-shadow: inset 0 1px 0 #fff, 0 2px 5px #5034480d;
  transition: transform .26s var(--desk-spring-press), background-color .18s, border-color .18s;
}

.study-page :is(.study-desk-nav a, .btn, .bar button, .tools button, .chip, .acts button, .copy, .jump a, :where(#toTop)):hover {
  background: #fff;
  border-color: #af96aa;
}

.study-page :is(.btn, .bar button, .tools button, .chip, .acts button, .copy, :where(#toTop)):active {
  transform: scale(.965);
}

.study-page :is(.btn.on, .bar button.on, .bar button.primary, .tools button.on, .chip.on, .acts button.on) {
  background: var(--desk-accent);
  border-color: var(--desk-accent);
  color: #fff;
  box-shadow: none;
}

.study-page :is(.btn.on, .bar button.on, .bar button.primary, .tools button.on, .chip.on, .acts button.on):hover {
  background: var(--desk-hover);
  color: #fff;
}

.study-page :is(.copy.done, .acts button.ok) {
  background: var(--okbg);
  border-color: var(--ok);
  color: var(--ok);
}

.study-page :is(.acts button.bad, .acts button.wrong) {
  background: var(--badbg);
  border-color: var(--bad);
  color: var(--bad);
}

.study-page button:disabled { opacity: .55; }

.study-page > :is(header, .top),
.study-page .study-hero,
.study-page[data-desk-page="premed-quiz"] > .bar {
  position: relative;
  isolation: isolate;
  z-index: auto;
  max-width: var(--desk-width);
  margin: 10px auto 14px;
  padding: clamp(16px, 3vw, 27px);
  border: 1px solid var(--desk-line);
  border-radius: 13px;
  background: linear-gradient(135deg, #fffdfd 46%, #f0e8ef);
  box-shadow: var(--desk-shadow);
}

/* A fold on the heading surface leaves the exercise and source areas quiet. */
.study-page > :is(header, .top)::after,
.study-page .study-hero::after,
.study-page[data-desk-page="premed-quiz"] > .bar::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0;
  right: 0;
  width: min(33%, 185px);
  height: 100%;
  background: linear-gradient(142deg, #d5c3d1 13%, #eee5ed 13% 38%, #d9c8d5 38% 51%, #f1eaf0 51%);
  clip-path: polygon(66% 0, 100% 0, 100% 82%, 59% 100%, 0 100%, 42% 61%);
  border-radius: 0 13px 13px 0;
  opacity: .53;
  pointer-events: none;
}

.study-page > :is(header, .top) h1,
.study-page .study-hero h1,
.study-page[data-desk-page="premed-quiz"] .bar h1 {
  margin: 0 0 6px;
  padding: 0;
  border: 0;
  color: var(--desk-ink);
  font: 400 clamp(26px, 4.8vw, 43px)/1.2 var(--desk-song);
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
}

.study-page > header .wrap { padding-inline: 0; }
.study-page > :is(header, .top, .study-hero) :is(.sub, p) { color: var(--desk-muted); }
.study-page .study-hero .sub { margin-bottom: 0; }
.study-page .wrap { max-width: var(--desk-width); }
.study-page .study-course-links {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin-top: 12px;
}
.study-page .study-course-links a {
  padding: 7px 10px;
  background: #fffdfd99;
  border: 1px solid var(--desk-line);
  border-radius: 7px;
  color: var(--desk-accent);
  font-size: .82em;
  text-decoration: none;
}
.study-page .study-course-links a:hover { background: var(--desk-fold); }

.study-page .bar,
.study-page .tools,
.study-page .filters,
.study-page > nav:not(.study-desk-nav),
.study-page .jump,
.study-page #score.score {
  position: static;
  inset: auto;
  z-index: auto;
}

.study-page :is(.bar, .tools, .filters, .jump) { color: var(--desk-muted); }
.study-page :is(.tools, .filters, .jump) { align-items: center; }
.study-page .tools { margin-top: 12px; }
.study-page .filters { padding-block: 9px; }
.study-page .bar {
  background: var(--desk-glass);
  backdrop-filter: blur(18px) saturate(135%);
  border: 1px solid var(--desk-line);
  border-radius: 10px;
  padding: 7px 9px;
}
.study-page .bar .score { color: var(--ok); font-family: system-ui, sans-serif; letter-spacing: 0; }
.study-page .bar .sc { color: var(--desk-ink); }
.study-page header .bar { margin-top: 12px; }
.study-page > nav:not(.study-desk-nav) {
  max-width: var(--desk-width);
  margin: 0 auto;
  background: transparent;
  border-color: var(--desk-line);
}
.study-page > nav:not(.study-desk-nav) a {
  background: var(--desk-fold);
  color: var(--desk-accent);
  border: 1px solid var(--desk-line);
}
.study-page > nav:not(.study-desk-nav) a:hover,
.study-page > nav:not(.study-desk-nav) a.hl {
  background: var(--desk-accent);
  color: #fff;
}
.study-page .jump {
  flex-direction: row;
  flex-wrap: wrap;
  max-width: var(--desk-width);
  margin: 8px auto 0;
  padding-inline: 14px;
}
.study-page .study-section-jump { margin-top: 12px; padding: 0; }
.study-page .jump a { display: inline-flex; align-items: center; }
.study-page #toTop {
  position: static;
  justify-content: center;
  margin: 12px auto;
}

.study-page :is(.qi, .card, .b1box, .essay, .hero, .q:has(> .qh), details.sec, details.honesty, #toc) {
  background: var(--desk-paper);
  border: 1px solid var(--desk-line);
  border-radius: 13px;
  box-shadow: var(--desk-shadow);
}
.study-page .sec .card { border-width: 1px 0 0; border-radius: 0; box-shadow: none; }
.study-page :is(.qi img, .imgs img, .card > img) { border-color: var(--desk-line); }
.study-page :is(.stem, .st, .ask, .card header h3) {
  font-size: clamp(17px, 2.35vw, 20px);
  line-height: 1.48;
}
.study-page :is(.tag:not(.warn, .ok, .n, .g, .bad), .b.sub) {
  background: var(--desk-fold);
  color: var(--desk-accent);
  border-color: #d8c9d6;
}
.study-page :is(.tag.warn, .noimg, .b.warn) {
  background: var(--warnbg);
  color: var(--warn);
  border-color: #d7bd91;
}
.study-page :is(.tag.g, .tag.ok, .b.exam) { background: var(--okbg); color: var(--ok); }
.study-page :is(.tag.bad, .tag.n) { background: var(--badbg); color: var(--bad); }
.study-page .opt {
  background: #fdfafb;
  border-color: var(--desk-line);
  color: var(--desk-ink);
}
.study-page :is(.opt.sel, button.opt:hover):not(.right, .wrong, .wrongpick) { background: var(--desk-fold); }
.study-page .opt :is(.lb, .k) { color: var(--desk-accent); }
/* Masked pages answer nothing until the card is opened: data-desk-mask="on". */
.study-page:not([data-desk-mask="on"]) .opt.right,
.study-page .card.ans-on .opt.right {
  background: var(--okbg);
  border-color: var(--ok);
}
.study-page:not([data-desk-mask="on"]) .opt.right :is(.k, .lb),
.study-page .card.ans-on .opt.right :is(.k, .lb) { color: var(--ok); }
.study-page :is(.opt.wrong, .card.ans-on .opt.wrongpick) {
  background: var(--badbg);
  border-color: var(--bad);
}
.study-page :is(.opt.wrong, .card.ans-on .opt.wrongpick) :is(.k, .lb) { color: var(--bad); }
/* Missed a correct option on a wrong answer: amber, distinct from the answer green. */
.study-page .card.ans-on .opt.missed {
  background: var(--warnbg);
  border-color: var(--warn);
}
.study-page .card.ans-on .opt.missed :is(.k, .lb) { color: var(--warn); }
.study-page .opt.mine:not(.right, .wrong, .wrongpick) { background: var(--warnbg); border-color: var(--warn); }
.study-page .card.ok { border-left: 3px solid var(--ok); }
.study-page .card.wrong { border-left: 3px solid var(--bad); }
.study-page .ans {
  background: linear-gradient(148deg, #fbf5f9, var(--desk-fold));
  border-color: #bca3b6;
  color: var(--desk-ink);
  transform-origin: top center;
}
.study-page .ans.warn { background: var(--warnbg); border-color: var(--warn); }
.study-page .ansline b { color: var(--ok); }
.study-page .mine { color: var(--desk-muted); }
.study-page :is(.note.srcbox, .note.mid, .note.none, .ans .src, .src.no, .card .src:not(span), .prompt, .b1lead) {
  background: #f4eef3;
  color: var(--desk-muted);
  border-color: #cdbac9;
}
.study-page .note.srcbox code {
  background: #e8dce6;
  color: #493646;
  overflow-wrap: anywhere;
}
.study-page .src::before,
.study-page .src.no::before { color: var(--desk-muted); }
.study-page :is(details pre, code, th) { background: #f2ebf0; }
.study-page :is(th, td) { border-color: var(--desk-line); }
.study-page :is(h2.part, article h2) {
  background: linear-gradient(113deg, var(--desk-fold) 64%, transparent 64%);
  border-color: #aa8fa3;
}

.study-page[data-desk-page="premed-guide"] :is(main p, main li, td, strong) { color: var(--desk-ink); }
.study-page[data-desk-page="premed-guide"] :is(blockquote, blockquote p, th) { color: var(--desk-muted); }
.study-page[data-desk-page="premed-guide"] :is(blockquote, tr:nth-child(even) td) { background: #f4edf2; border-color: var(--desk-line); }
.study-page[data-desk-page="premed-guide"] :is(code, hr, .foot) { border-color: var(--desk-line); }
.study-page[data-desk-page="premed-guide"] code { color: var(--desk-accent); }
.study-page[data-desk-page="premed-guide"] .go a { background: var(--desk-accent); color: #fff; }
.study-page[data-desk-page="premed-guide"] .go a:hover { background: var(--desk-hover); }

.study-page[data-desk-page="premed-quiz"] .q {
  font-size: clamp(17px, 2.35vw, 20px);
  line-height: 1.48;
}
.study-page[data-desk-page="premed-quiz"] .bar h1 {
  display: flex;
  flex-wrap: wrap;
}
.study-page[data-desk-page="premed-quiz"] .bar h1 span {
  color: var(--desk-muted);
  font-family: system-ui, sans-serif;
}
.study-page[data-desk-page="premed-quiz"] .bar h1 .score { color: var(--ok); }
.study-page[data-desk-page="premed-quiz"] .hd { color: var(--desk-muted); }
.study-page[data-desk-page="premed-quiz"] button.show {
  background: var(--desk-accent);
  border-color: var(--desk-accent);
  color: #fff;
}
.study-page[data-desk-page="premed-quiz"] button.show:hover { background: var(--desk-hover); }
.study-page[data-desk-page="odontogenic"] #score {
  max-width: var(--desk-width);
  margin: 0 auto 12px;
  background: var(--desk-glass);
  border: 1px solid var(--desk-line);
  border-radius: 11px;
}
.study-page[data-desk-page="odontogenic"] .card > .q { font-size: 20px; }
.study-page.hide-ans[data-desk-page="imaging-list"] .ans b { background: #d9ccd6; color: transparent; }
.study-page[data-desk-page="imaging-quiz"] :is(.prompt b, summary) { color: var(--desk-accent); }
.study-page[data-desk-page="imaging-quiz"] details { background: #f5eef4; border-color: var(--desk-line); }
.study-page[data-desk-page="imaging-quiz"] details .ans { background: transparent; color: var(--desk-accent); font-family: var(--desk-song); font-size: 18px; }
.study-page[data-desk-page="pharm"] details { border: 1px solid var(--desk-line); }

@media (prefers-reduced-motion: no-preference) {
  .study-page .ans.on,
  .study-page:not(:has(#revealAll.on)) .ans.show,
  .study-page:not(.showAll) .card.shown .ans,
  .study-page[data-desk-page="imaging-quiz"] details[open] > p:first-of-type {
    animation: desk-unfold .34s cubic-bezier(.19, 1, .36, 1) both;
  }
  .study-page:has(#showAll.on) .ans.on { animation: none; }
}

@keyframes desk-unfold {
  from { opacity: .28; transform: perspective(460px) rotateX(-30deg); }
  to { opacity: 1; transform: none; }
}

@media (max-width: 860px) {
  .study-page > :is(header, .top),
  .study-page[data-desk-page="premed-quiz"] > .bar { margin-inline: 12px; }
  .study-page[data-desk-page="odontogenic"] #score { margin-inline: 14px; }
}

@media (max-width: 540px) {
  .pleats { height: 65px; width: 155px; opacity: .65; bottom: 27px; }
}

@media (max-width: 520px) {
  .study-page .study-desk-links { gap: 5px 9px; }
  .study-page .study-desk-links > span { margin-inline-start: 0; }
  .study-page > :is(header, .top),
  .study-page .study-hero,

"第九次课 · 口腔修复陶瓷材料","count":20,"phase":7},{"number":11,"title":"第十一章-树脂基牙齿充填材料","pages":"182–200","lesson":"第三次课 · 树脂基复合材料","count":13,"phase":4},{"number":12,"title":"第十二章-口腔粘接材料","pages":"201–216","lesson":"第三次课 · 作业涉及粘接，课程目录未单列","count":3,"phase":0},{"number":13,"title":"第十三章-牙科银汞合金","pages":"217–227","lesson":"","count":0,"phase":0},{"number":14,"title":"第十四章-牙科水门汀","pages":"228–249","lesson":"第二次课 · 五类水门汀与课件","count":16,"phase":6},{"number":15,"title":"第十五章-牙髓及根管治疗材料","pages":"250–262","lesson":"第四次课 · 根管充填材料（课件与配套 PDF）","count":12,"phase":0},{"number":16,"title":"第十六章-口腔植入材料","pages":"263–279","lesson":"","count":0,"phase":0},{"number":17,"title":"第十七章-口腔正畸材料","pages":"280–287","lesson":"","count":0,"phase":0},{"number":18,"title":"第十八章-预防保健材料","pages":"288–297","lesson":"","count":0,"phase":0},{"number":19,"title":"第十九章-切削与研磨","pages":"298–303","lesson":"","count":0,"phase":0},{"number":20,"title":"第二十章-辅助材料","pages":"304–311","lesson":"","count":0,"phase":0}],"short":[{"id":"s1","chapter":2,"stem":"分别说明弹性变形、塑性变形、弹性模量和疲劳断裂。","points":["卸载后可恢复的变形是弹性变形；卸载后留下的永久变形是塑性变形。","弹性模量是应力—应变曲线线弹性段的斜率，反映材料抵抗弹性变形的能力。","反复交变载荷可使材料在低于静载断裂强度的应力下发生疲劳断裂。"],"basis":"教材第 2 章，PDF 48–75 页；阶段性测试第 1、2、5、7 题涉及相应概念。"},{"id":"s2","chapter":3,"stem":"为什么藻酸盐印模应尽快灌注？比较缩合型和加成型硅橡胶印模的尺寸稳定性。","points":["藻酸盐印模失水可收缩，吸水可膨胀；按要求清洗、消毒后尽快灌注模型。","缩合型硅橡胶固化产生可挥发的小分子副产物，逸出会引起尺寸变化。","加成型硅橡胶的主反应无挥发性缩合副产物，一般具有更好的尺寸稳定性。"],"basis":"教材第 3 章，PDF 76–93 页；第三次作业第 3、4、9 题。"},{"id":"s3","chapter":4,"stem":"增加石膏调和的水粉比，对凝固时间、强度和凝固膨胀分别有什么影响？","points":["通常凝固时间延长，单位体积内晶核减少。","凝固后孔隙增多，强度下降。","晶体间相互挤压减弱，凝固膨胀减小。"],"basis":"教材第 4 章，PDF 94–101 页；第三次作业第 17、27 题。"},{"id":"s4","chapter":7,"stem":"热凝与自凝 PMMA 基托材料如何引发聚合？热凝材料何时装盒？","points":["两者均属于自由基加成聚合，MMA 为单体。","热凝型靠加热使过氧化物引发剂分解；自凝型由促进剂在室温下促使过氧化物分解并产生自由基。","热凝型在面团期装盒，此时可塑且不粘器械；过早易粘、过晚流动和塑形变差。"],"basis":"教材第 7 章，PDF 120–131 页；第三次作业第 39、49 题，阶段性测试第 8、35、37 题。"},{"id":"s5","chapter":9,"stem":"烤瓷合金与瓷通过哪些方式结合？为什么要考虑两者的热膨胀系数？","points":["结合方式包括化学结合、机械嵌合、范德瓦耳斯力和残余压应力；合金表面的稳定氧化膜参与主要的化学结合。","膨胀系数需相匹配，合金通常略大于瓷，使冷却后瓷层保留适度压应力。","失配过大会使残余应力增大，并增加开裂或崩瓷风险。"],"basis":"教材第 9–10 章，PDF 138–181 页；第四次作业第 21、24 题，阶段性测试第 44、50 题。"},{"id":"s6","chapter":10,"stem":"从机制和材料选择两方面，比较氧化锆陶瓷与二硅酸锂玻璃陶瓷。","points":["可发生应力诱导相变的氧化锆在裂纹尖端发生四方相向单斜相转变，体积膨胀并形成局部压应力，阻碍裂纹扩展。","氧化锆通常有较高的抗弯强度，具体强度和透光性随牌号而变；可据适应证用于高负荷修复。","二硅酸锂玻璃陶瓷兼具强度和半透明性，可依具体适应证用于前牙贴面、嵌体或单冠。"],"basis":"教材第 10 章，PDF 160–181 页；第四次作业第 10、12、18、19、25 题。"},{"id":"s7","chapter":11,"stem":"复合树脂的主要组分及其作用是什么？说出一个聚合收缩的临床后果。","points":["有机树脂基质发生聚合，形成连续相；引发体系启动聚合。","无机填料提高刚度、强度和耐磨性，通常降低整体聚合收缩。","硅烷偶联剂使无机填料与树脂基质结合，利于界面应力传递。","收缩应力可损害边缘密合，形成边缘间隙。"],"basis":"教材第 11 章，PDF 182–200 页；第二次作业第 1–3、6 题，阶段性测试第 11–13、21 题。"},{"id":"s8","chapter":14,"stem":"比较传统玻璃离子、磷酸锌、聚羧酸锌和氧化锌丁香酚水门汀的主要特点。","points":["传统玻璃离子经酸碱反应固化，对牙体有化学黏接并释氟；早期应隔湿并防失水。","磷酸锌初期酸性较高，有刺激牙髓的可能；固位主要依赖机械嵌合。","聚羧酸锌可与牙体组织形成化学黏接，对牙髓刺激相对较小。","含丁香酚的氧化锌丁香酚材料可用于暂封，但丁香酚可抑制树脂自由基聚合。"],"basis":"教材第 14 章，PDF 228–249 页；第一次作业第 18–24 题，阶段性测试第 15–20 题。"},{"id":"s9","chapter":15,"stem":"牙胶尖和根管封闭剂分别承担什么作用？理想的根管充填材料应具备哪些性能？","points":["牙胶尖作为固体核心，占据根管主体空间并可受热软化成形。","封闭剂填补牙胶尖与根管壁、各牙胶尖间的间隙并辅助封闭。","理想材料应具备良好的封闭性、尺寸稳定性、生物相容性及 X 线阻射性；应便于置入，必要时便于去除。"],"basis":"教材第 15 章，PDF 250–262 页；第二次作业第 14–16、20–24 题。"}],"sources":["第一次作业","第二次作业","第三次作业","第四次作业","阶段性测试"]}</script>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const bank = JSON.parse(byId('bank').textContent);
  const items = new Map([...bank.questions, ...bank.short].map(q => [q.id, q]));
  const titles = new Map(bank.chapters.map(c => [c.number, c.title]));
  const selectors = ['kind', 'source', 'chapter', 'scope', 'size'];
  const storageKey = 'med-imaging-exam:dental-materials:v1';
  const params = new URLSearchParams(location.search);

  function node(tag, text, className) {
    const item = document.createElement(tag);
    if (text) item.textContent = text;
    if (className) item.className = className;
    return item;
  }

  function restore() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved && typeof saved.history === 'object' && saved.history && typeof saved.flags === 'object' && saved.flags) return saved;
    } catch (_error) {
      // file:// previews or browser storage restrictions may prevent resuming.
    }
    return { history: {}, flags: {}, active: null };
  }

  const state = restore();
  let active;
  const selected = () => Object.fromEntries(selectors.map(id => [id, byId(id).value]));
  const isShort = q => !!q.points;
  const key = q => q.key || q.id;
  const activeItems = () => active.ids.map(id => items.get(id));

  function save() {
    state.active = active;
    try { localStorage.setItem(storageKey, JSON.stringify(state)); }
    catch (_error) { byId('help').textContent = '浏览器存储不可用，本次练习仍可作答，刷新后进度会丢失。'; }
  }

  bank.sources.forEach((s, index) => byId('source').add(new Option(s, index)));
  bank.chapters.forEach(c => byId('chapter').add(new Option(c.title, c.number)));

  function pool(settings) {
    const short = settings.kind === 'short';
    const matches = (short ? bank.short : bank.questions).filter(q => {
      if (!short && settings.source !== 'all' && q.source !== Number(settings.source)) return false;
      if (settings.chapter !== 'all' && q.chapter !== Number(settings.chapter)) return false;
      if (settings.scope === 'graded') return !short && !!q.answer;
      if (settings.scope === 'official') return !short && q.basis.endsWith('平台公布');
      if (settings.scope === 'wrong') return state.history[key(q)] === 'wrong';
      if (settings.scope === 'gaps') return (!short && !q.answer) || !!state.flags[key(q)];
      return true;
    });
    if (short || settings.source !== 'all') return matches;
    const unique = new Map();
    for (const q of matches) {
      if (!unique.has(q.key) || (!unique.get(q.key).answer && q.answer)) unique.set(q.key, q);
    }
    return [...unique.values()];
  }

  function showPool() {
    const short = byId('kind').value === 'short';
    byId('source-field').hidden = short;
    for (const value of ['graded', 'official']) byId('scope').querySelector(`[value=${value}]`).disabled = short;
    byId('scope').querySelector('[value=wrong]').textContent = short ? '上次没答全' : '上次答错';
    if (short && ['graded', 'official'].includes(byId('scope').value)) byId('scope').value = 'all';
    const candidates = pool(selected());
    byId('pool').textContent = `当前筛选 ${candidates.length} 题` + (short ? '，按要点自评。' : `，其中 ${candidates.filter(q => q.answer).length} 题可判分。`);
    byId('start').disabled = !candidates.length;
  }

  function start(settings, questions, scroll = false) {
    let slate = questions ?? pool(settings);
    if (!questions && settings.size !== 'all') {
      for (let index = slate.length - 1; index > 0; index--) {
        const other = Math.floor(Math.random() * (index + 1));
        [slate[index], slate[other]] = [slate[other], slate[index]];
      }
      slate = slate.slice(0, Number(settings.size));
    }
    active = { settings, ids: slate.map(q => q.id), answers: {}, ratings: {}, submitted: false };
    render();
    save();
    if (scroll && slate.length) byId('questions').scrollIntoView({ block: 'start' });
  }

  function flag(q) {
    const button = node('button');
    button.type = 'button';
    const update = () => {
      const flagged = !!state.flags[key(q)];
      button.setAttribute('aria-pressed', String(flagged));
      button.textContent = flagged ? '已标待复习' : '标为待复习';
    };
    button.addEventListener('click', () => {
      state.flags[key(q)] = !state.flags[key(q)];
      update();
      showPool();
      save();
    });
    update();
    return button;
  }

  function choice(q, card, heading) {
    const selectedAnswer = active.answers[q.id];
    const group = node('div');
    group.setAttribute('role', 'radiogroup');
    group.setAttribute('aria-labelledby', heading.id);
    for (const opt of q.options) {
      const label = node('label', '', 'option');
      const radio = node('input');
      radio.type = 'radio';
      radio.name = q.id;
      radio.value = opt.label;
      radio.checked = selectedAnswer === opt.label;
      radio.disabled = active.submitted;
      if (radio.checked) label.classList.add('chosen');
      if (active.submitted && q.answer && q.answer === opt.label) label.classList.add('correct');
      if (active.submitted && q.answer && radio.checked && q.answer !== opt.label) label.classList.add('incorrect');
      radio.addEventListener('change', () => {
        active.answers[q.id] = opt.label;
        for (const option of group.children) option.classList.toggle('chosen', option === label);
        progress();
        save();
      });
      label.append(radio, node('span', `${opt.label}. ${opt.text}`));
      group.append(label);
    }
    card.append(group);
    if (active.submitted) {
      const feedback = node('div', '', 'feedback');
      const verdict = q.answer ? (selectedAnswer === q.answer ? '答对' : selectedAnswer ? '答错' : '未作答') : '答案待核 · 本题不计分';
      feedback.append(node('p', q.answer ? `${verdict} · 答案 ${q.answer} · ${q.basis}` : verdict));
      if (q.note) feedback.append(node('p', q.note, 'meta'));
      card.append(feedback);
    }
  }

  function shortAnswer(q, card, heading) {
    const input = node('textarea');
    input.rows = 3;
    input.value = active.answers[q.id] || '';
    input.placeholder = '先写关键词，或在心里复述';
    input.setAttribute('aria-labelledby', heading.id);
    input.readOnly = active.submitted;
    input.addEventListener('input', () => {
      active.answers[q.id] = input.value;
      progress();
      save();
    });
    card.append(input);
    if (!active.submitted) return;
    const feedback = node('div', '', 'feedback');
    const list = node('ul');
    for (const point of q.points) list.append(node('li', point));
    const rating = node('div', '', 'tools');
    for (const [value, label] of [['correct', '答全'], ['wrong', '要补']]) {
      const button = node('button', label);
      button.type = 'button';
      button.setAttribute('aria-pressed', String(active.ratings[q.id] === value));
      button.addEventListener('click', () => {
        active.ratings[q.id] = value;
        state.history[key(q)] = value;
        for (const other of rating.children) other.setAttribute('aria-pressed', String(other === button));
        save();
        showPool();
        showResult();
      });
      rating.append(button);
    }
    feedback.append(node('strong', '参考要点'), list, node('p', q.basis, 'meta'), rating);
    card.append(feedback);
  }

  function progress() {
    const filled = active.ids.filter(id => active.answers[id]?.trim()).length;
    byId('progress').textContent = `已填写 ${filled} / ${active.ids.length}`;
  }

  function retryItems() {
    return activeItems().filter(q => isShort(q) ? active.ratings[q.id] === 'wrong' : q.answer && active.answers[q.id] && active.answers[q.id] !== q.answer);
  }

  function showResult() {
    const section = byId('result');
    section.hidden = !active.submitted;
    section.replaceChildren();
    if (!active.submitted) { byId('retry').hidden = true; return; }
    const questions = activeItems();
    let summary;
    if (active.settings.kind === 'short') {
      const mastered = Object.values(active.ratings).filter(status => status === 'correct').length;
      const review = retryItems().length;
      summary = `答全 ${mastered} · 要补 ${review} · 未自评 ${questions.length - mastered - review}`;
    } else {
      const gradable = questions.filter(q => q.answer);
      const correct = gradable.filter(q => active.answers[q.id] === q.answer).length;
      const blank = gradable.filter(q => !active.answers[q.id]).length;
      const score = gradable.length ? `得分 ${correct} / ${gradable.length}` : '本卷暂无可判分题';
      const referenceCount = gradable.filter(q => q.basis.startsWith('教材参考')).length;
      summary = `${score} · 答错 ${gradable.length-correct-blank} · 可判分未作答 ${blank} · 答案待核 ${questions.length-gradable.length}`;
      if (referenceCount) summary += ` · 判分含 ${referenceCount} 道教材参考题`;
    }
    section.append(node('h2', active.settings.kind === 'short' ? '简答自评' : '练习结果'), node('p', summary, 'metrics'));
    byId('retry').textContent = active.settings.kind === 'short' ? '重练本卷要补的题' : '重练本卷错题';
    byId('retry').hidden = !retryItems().length;
  }

  function render() {
    const list = byId('questions');
    list.replaceChildren();
    for (const [index, q] of activeItems().entries()) {
      const card = node('article', '', 'question');
      card.id = `question-${q.id}`;
      const source = isShort(q) ? '简答自评 · 教材要点练习' : `${bank.sources[q.source]} · 原题 ${q.no}`;
      card.append(node('div', `${source} · ${titles.get(q.chapter)}`, 'meta'));
      const heading = node('h3', `${index+1}. ${q.stem}`);
      heading.id = `stem-${q.id}`;
      card.append(heading);
      if (isShort(q)) shortAnswer(q, card, heading);
      else choice(q, card, heading);
      const tools = node('div', '', 'tools');
      tools.append(flag(q));
      card.append(tools);
      list.append(card);
    }
    if (!active.ids.length) list.append(node('p', '这个筛选没有题目。换个章节或练习范围再试。'));
    byId('submit-area').hidden = !active.ids.length || active.submitted;
    byId('submit').textContent = active.settings.kind === 'short' ? '展开简答要点' : '交卷并核对';
    showPool();
    showResult();
    progress();
  }

  const linkedFilters = selectors.some(id => params.has(id));
  for (const id of selectors) {
    const element = byId(id);
    const value = linkedFilters ? params.get(id) : state.active?.settings?.[id];
    if ([...element.options].some(option => option.value === value)) element.value = value;
    element.addEventListener('change', showPool);
  }
  byId('start').addEventListener('click', () => start(selected(), null, true));
  byId('retry').addEventListener('click', () => start(active.settings, retryItems(), true));
  byId('submit').addEventListener('click', () => {
    active.submitted = true;
    for (const q of activeItems()) {
      const picked = active.answers[q.id];
      if (!isShort(q) && q.answer && picked) state.history[key(q)] = picked === q.answer ? 'correct' : 'wrong';
    }
    render();
    save();
    byId('result').scrollIntoView({ block: 'start' });
  });
  showPool();
  const saved = state.active;
  if (!linkedFilters && saved?.settings && Array.isArray(saved.ids) && saved.ids.every(id => items.has(id))) {
    active = saved;
    render();
  } else start(selected());
})();

</script>
</body></html>
