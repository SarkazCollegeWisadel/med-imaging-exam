<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>临床流行病学 · 抽查版（236题）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1115;color:#e8eaed;font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:0 0 90px}
.bar{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.97);backdrop-filter:blur(8px);border-bottom:1px solid #252932;padding:10px 14px}
.bar h1{margin:0 0 8px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar h1 span{font-size:12px;font-weight:400;color:#8a93a3}
.score{margin-left:auto;font-size:13px;color:#6ee7a8;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #2f3542;background:#1a1e26;color:#cfd6e0;border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;transition:.15s}
button:hover{background:#232936;border-color:#3d4553}
button.on{background:#60475a;border-color:#60475a;color:#fff}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.card{background:#161a21;border:1px solid #252932;border-radius:12px;padding:16px;margin-bottom:14px}
.card.wrong{border-left:3px solid #f87171}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:#8a93a3;flex-wrap:wrap}
.tag{background:#232936;border-radius:5px;padding:2px 8px;font-size:11px}
.tag.s{color:#93c5fd}.tag.m{color:#fbbf24}
.tag.bad{background:#7f1d1d;color:#fca5a5}
.tag.tp{background:#1e293b;color:#94a3b8}
.q{font-size:16px;font-weight:500;margin:0 0 12px;line-height:1.65;font-family:"Desk Song","STSong","华文宋体",serif;font-weight:400}
.opt{border:1px solid #252932;border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:15px;display:flex;gap:10px;transition:.12s}
.opt .k{color:#8a93a3;font-weight:600;min-width:18px;flex-shrink:0}
.card.ans-on .opt.right{border-color:#34d399;background:rgba(52,211,153,.1)}
.card.ans-on .opt.right .k{color:#34d399}
.card.ans-on .opt.wrongpick{border-color:#f87171;background:rgba(248,113,113,.09)}
.card.ans-on .opt.wrongpick .k{color:#f87171}
.card.ans-on .opt.missed{border-color:#fbbf24;background:rgba(251,191,36,.08)}
.card.ans-on .opt.missed .k{color:#fbbf24}
.ans{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #2f3542}
.card.ans-on .ans{display:block}
.ansline{font-size:15px;margin-bottom:5px}
.ansline b{color:#6ee7a8}
.mine{font-size:14px;color:#f87171}
.mine.ok{color:#6ee7a8}
.show{width:100%;margin-top:12px;background:#1e293b;border-color:#334155;color:#cbd5e1;padding:9px}
.show:hover{background:#263449}
.foot{text-align:center;color:#5b6472;font-size:12px;padding:20px 14px;line-height:1.8}
.empty{text-align:center;color:#5b6472;padding:40px}
@media(max-width:520px){.wrap{padding:10px}.card{padding:13px}.q{font-size:15px}.opt{font-size:14px;padding:8px 10px}}
</style>
<style>
@view-transition{navigation:auto}
::view-transition-old(root){animation:eq-out .2s ease both}
::view-transition-new(root){animation:eq-in .36s cubic-bezier(.22,1,.36,1) both}
@keyframes eq-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes eq-in{from{opacity:0;transform:translateY(9px)}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*),*{animation:none!important;transition:none!important}}
.study-desk-nav{display:block;box-sizing:border-box;position:relative;inset:auto;z-index:auto;max-width:none;background:#f2edf1;color:#463747;border:0;border-bottom:1px solid #8d718b38;padding:8px clamp(12px,4vw,48px);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
.study-desk-nav .study-desk-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;max-width:1440px;margin:auto}
.study-desk-nav a,.study-desk-nav a:visited{display:inline-flex;align-items:center;min-height:34px;box-sizing:border-box;margin:0;padding:3px 10px;border:1px solid #8d718b60;border-radius:100px;background:#ffffff87;color:#4c3c4a;text-decoration:none;font:inherit;white-space:nowrap}
.study-desk-nav a:hover{background:white;color:#332332}
.study-desk-nav a:focus-visible{outline:2px solid #74546d;outline-offset:2px}
</style>
<style id="study-desk-theme">
@font-face {
  font-family: "Desk Song";
  src: local("STSong"), local("华文宋体");
  font-weight: 400;
  font-display: swap;
}

:root {
  color-scheme: light;
  --desk-bg: #f3f0f1;
  --desk-paper: #fffdfd;
  --desk-ink: #2d272e;
  --desk-muted: #625561;
  --desk-line: #dcd1da;
  --desk-fold: #ede4eb;
  --desk-accent: #60475a;
  --desk-hover: #75576e;
  --desk-glass: linear-gradient(151deg, #fffdfdf2, #eee6eddb);
  --desk-shadow: 0 2px 4px #392f3609, 0 8px 24px #392f3608;
  --desk-song: "Desk Song", "STSong", "华文宋体", "Songti SC", SimSun, serif;
  --desk-width: 820px;
  --desk-spring: cubic-bezier(.18, 1.24, .32, 1);
  --desk-spring-press: cubic-bezier(.2, 1.45, .47, 1);

  /* Existing pages use several names for the same roles. */
  --bg: var(--desk-bg);
  --card: var(--desk-paper);
  --card2: var(--desk-fold);
  --ink: var(--desk-ink);
  --tx: var(--desk-ink);
  --sub: var(--desk-muted);
  --dim: var(--desk-muted);
  --line: var(--desk-line);
  --hl: var(--desk-accent);
  --hl2: var(--desk-accent);
  --acc: var(--desk-accent);
  --accent: var(--desk-accent);
  --code: var(--desk-fold);
  --ok: #226040;
  --okbg: #e8f4eb;
  --bad: #922f34;
  --badbg: #faebec;
  --warn: #744c1b;
  --warnbg: #f7f0e3;
}

@view-transition{navigation:auto}
::view-transition-old(root){animation:desk-page-out .2s ease both}
::view-transition-new(root){animation:desk-page-in .36s cubic-bezier(.22,1,.36,1) both}
@keyframes desk-page-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes desk-page-in{from{opacity:0;transform:translateY(9px)}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

.pleats{position:absolute;z-index:-1;overflow:hidden;right:-1px;bottom:23px;width:clamp(160px,27vw,370px);height:100px;pointer-events:none;opacity:.86}
.pleats i{position:absolute;inset:0}
.pleats i:nth-child(1){clip-path:polygon(0 88%,42% 13%,33% 100%);background:linear-gradient(130deg,#c5b5c496,#efeaed)}
.pleats i:nth-child(2){clip-path:polygon(33% 100%,42% 13%,62% 29%);background:linear-gradient(130deg,#c0abba,#e9e0e7)}
.pleats i:nth-child(3){clip-path:polygon(33% 100%,62% 29%,62% 75%);background:linear-gradient(140deg,#eee5ec,#d4c4d0)}
.pleats i:nth-child(4){clip-path:polygon(62% 29%,83% 0,62% 75%);background:linear-gradient(125deg,#c7b2c2,#eee5ec)}
.pleats i:nth-child(5){clip-path:polygon(62% 75%,83% 0,100% 56%);background:linear-gradient(120deg,#d5c4d0,#f4eff4)}

body.study-page {
  background: radial-gradient(ellipse at 85% 0, #eee6ed, transparent 550px), var(--desk-bg);
  color: var(--desk-ink);
  font-family: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", sans-serif;
}

.study-page :is(h1, h2, .stem, .st, .ask, .card header h3, .ans .dx),
.study-page[data-desk-page="premed-quiz"] .q,
.study-page[data-desk-page="odontogenic"] .card > .q {
  font-family: var(--desk-song);
  font-weight: 400;
  text-wrap: pretty;
}

.study-page :is(h1, h2, h3, h4) { color: var(--desk-ink); }
.study-page a { color: var(--desk-accent); }
.study-page :is(.sub, .foot, .src, .hint, .cap, figcaption, .who) { color: var(--desk-muted); }
.study-page :is(a, button, summary, input, textarea):focus-visible {
  outline: 2px solid var(--desk-accent);
  outline-offset: 3px;
}

.study-page .study-desk-nav {
  position: relative;
  isolation: isolate;
  background: transparent;
  padding-inline: clamp(10px, 3vw, 22px);
  border-bottom: 0;
}

.study-page .study-desk-nav::after {
  content: "";
  position: absolute;
  inset: auto max(12px, calc((100% - var(--desk-width)) / 2)) 0;
  border-bottom: 1px solid var(--desk-line);
  pointer-events: none;
}

.study-page .study-desk-links { max-width: var(--desk-width); }
.study-page .study-desk-links > span {
  margin-inline-start: auto;
  color: var(--desk-muted);
  font-size: .83em;
}

.study-page :is(.study-desk-nav a, .btn, .bar button, .tools button, .chip, .acts button, .copy, .jump a, :where(#toTop)) {
  min-height: 34px;
  border: 1px solid var(--desk-line);
  border-radius: 100px;
  background: var(--desk-glass);
  color: var(--desk-accent);
  box-shadow: inset 0 1px 0 #fff, 0 2px 5px #5034480d;
  transition: transform .26s var(--desk-spring-press), background-color .18s, border-color .18s;
}

.study-page :is(.study-desk-nav a, .btn, .bar button, .tools button, .chip, .acts button, .copy, .jump a, :where(#toTop)):hover {
  background: #fff;
  border-color: #af96aa;
}

.study-page :is(.btn, .bar button, .tools button, .chip, .acts button, .copy, :where(#toTop)):active {
  transform: scale(.965);
}

.study-page :is(.btn.on, .bar button.on, .bar button.primary, .tools button.on, .chip.on, .acts button.on) {
  background: var(--desk-accent);
  border-color: var(--desk-accent);
  color: #fff;
  box-shadow: none;
}

.study-page :is(.btn.on, .bar button.on, .bar button.primary, .tools button.on, .chip.on, .acts button.on):hover {
  background: var(--desk-hover);
  color: #fff;
}

.study-page :is(.copy.done, .acts button.ok) {
  background: var(--okbg);
  border-color: var(--ok);
  color: var(--ok);
}

.study-page :is(.acts button.bad, .acts button.wrong) {
  background: var(--badbg);
  border-color: var(--bad);
  color: var(--bad);
}

.study-page button:disabled { opacity: .55; }

.study-page > :is(header, .top),
.study-page .study-hero,
.study-page[data-desk-page="premed-quiz"] > .bar {
  position: relative;
  isolation: isolate;
  z-index: auto;
  max-width: var(--desk-width);
  margin: 10px auto 14px;
  padding: clamp(16px, 3vw, 27px);
  border: 1px solid var(--desk-line);
  border-radius: 13px;
  background: linear-gradient(135deg, #fffdfd 46%, #f0e8ef);
  box-shadow: var(--desk-shadow);
}

/* A fold on the heading surface leaves the exercise and source areas quiet. */
.study-page > :is(header, .top)::after,
.study-page .study-hero::after,
.study-page[data-desk-page="premed-quiz"] > .bar::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0;
  right: 0;
  width: min(33%, 185px);
  height: 100%;
  background: linear-gradient(142deg, #d5c3d1 13%, #eee5ed 13% 38%, #d9c8d5 38% 51%, #f1eaf0 51%);
  clip-path: polygon(66% 0, 100% 0, 100% 82%, 59% 100%, 0 100%, 42% 61%);
  border-radius: 0 13px 13px 0;
  opacity: .53;
  pointer-events: none;
}

.study-page > :is(header, .top) h1,
.study-page .study-hero h1,
.study-page[data-desk-page="premed-quiz"] .bar h1 {
  margin: 0 0 6px;
  padding: 0;
  border: 0;
  color: var(--desk-ink);
  font: 400 clamp(26px, 4.8vw, 43px)/1.2 var(--desk-song);
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
}

.study-page > header .wrap { padding-inline: 0; }
.study-page > :is(header, .top, .study-hero) :is(.sub, p) { color: var(--desk-muted); }
.study-page .study-hero .sub { margin-bottom: 0; }
.study-page .wrap { max-width: var(--desk-width); }
.study-page .study-course-links {
  display: grid;

  gap: 6px;
  margin-top: 12px;
}
.study-page .study-course-links a {
  padding: 7px 10px;
  background: #fffdfd99;
  border: 1px solid var(--desk-line);
  border-radius: 7px;

  text-decoration: none;
}
.study-page .study-course-links a:hover { background: var(--desk-fold); }

.study-page .bar,
.study-page .tools,
.study-page .filters,
.study-page > nav:not(.study-desk-nav),
.study-page .jump,
.study-page #score.score {

}

.study-page :is(.bar, .tools, .filters, .jump) { color: var(--desk-muted); }

.study-page .tools { margin-top: 12px; }
.study-page .filters { padding-block: 9px; }
.study-page .bar {

  padding: 7px 9px;
}
.study-page .bar .score { color: var(--ok); font-family: system-ui, sans-serif; letter-spacing: 0; }

.study-page > nav:not(.study-desk-nav) {
  max-width: var(--desk-width);
  margin: 0 auto;

}

}
.study-page > nav:not(.study-desk-nav) a:hover,
.study-page > nav:not(.study-desk-nav) a.hl {
  background: var(--desk-accent);

}
.study-page .jump {

.study-page :is(.qi, .card, .b1box, .essay, .hero, .q:has(> .qh), details.sec, details.honesty, #toc) {

.study-page .opt {

}
.study-page :is(.opt.sel, button.opt:hover):not(.right, .wrong, .wrongpick) { background: var(--desk-fold); }

const list=document.getElementById('list'),sc=document.getElementById('sc');
let view='all', order=DATA.map((_,i)=>i), revealAllOn=false;

function matches(q){
  if(view==='wrong') return q.wrong;
  if(view==='single') return q.type.indexOf('单选')>=0;
  if(view==='multi') return q.type.indexOf('多选')>=0;
  return true;
}
function render(){
  const rows=order.map(i=>DATA[i]).filter(matches);
  list.innerHTML='';
  if(!rows.length){list.innerHTML='<p class="empty">没有符合条件的题目。</p>';}
  rows.forEach(q=>{
    const ans=new Set(q.answer.split(''));
    const mine=new Set((q.mine||'').split('').filter(Boolean));
    const card=document.createElement('div');
    card.className='card'+(q.wrong?' wrong':'')+(revealAllOn?' ans-on':'');
    const opts=q.options.map(o=>{
      const[k,...rest]=o.split('|'); const v=rest.join('|');
      let cls='opt';
      if(ans.has(k)) cls+=' right';
      if(q.wrong&&mine.has(k)&&!ans.has(k)) cls+=' wrongpick';
      if(q.wrong&&ans.has(k)&&!mine.has(k)) cls+=' missed';
      return `<div class="${cls}"><span class="k">${k}</span><span>${v}</span></div>`;
    }).join('');
    const tps=q.topics.map(t=>`<span class="tag tp">${t}</span>`).join('');
    card.innerHTML=`
      <div class="hd">
        <span class="tag ${q.type.indexOf('多选')>=0?'m':'s'}">${q.type}</span>
        <span class="tag">${q.points} 分</span>
        <span class="tag">${q.exam}</span>
        ${q.wrong?'<span class="tag bad">我错过</span>':''}
        ${tps}
      </div>
      <p class="q">${q.stem}</p>
      ${opts}
      <div class="ans">
        <div class="ansline">标准答案：<b>${q.answer}</b></div>
        <div class="mine ${q.wrong?'':'ok'}">我当时选：${q.mine||'—'}${q.wrong?'（错）':'（对）'}</div>
      </div>
      <button class="show">显示答案</button>`;
    card.querySelector('.show').addEventListener('click',e=>{
      card.classList.toggle('ans-on');
      e.target.textContent=card.classList.contains('ans-on')?'收起答案':'显示答案';
    });
    if(card.classList.contains('ans-on')) card.querySelector('.show').textContent='收起答案';
    list.appendChild(card);
  });
  sc.textContent=`显示 ${rows.length} / ${DATA.length}`;
}
function setView(v,btn){
  view=v;
  ['fAll','fWrong','fSingle','fMulti'].forEach(id=>document.getElementById(id).classList.toggle('on',id===btn));
  render();
}
document.getElementById('fAll').onclick=e=>setView('all','fAll');
document.getElementById('fWrong').onclick=e=>setView('wrong','fWrong');
document.getElementById('fSingle').onclick=e=>setView('single','fSingle');
document.getElementById('fMulti').onclick=e=>setView('multi','fMulti');
document.getElementById('shuffle').onclick=()=>{
  const a=order.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  order=a; revealAllOn=false;
  document.getElementById('revealAll').textContent='全部显示答案';
  render();
};
document.getElementById('revealAll').onclick=e=>{
  revealAllOn=!revealAllOn;
  e.target.textContent=revealAllOn?'全部收起答案':'全部显示答案';
  render();
};
render();
</script>
